apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  labels:
    app.kubernetes.io/name: simulator
    app.kubernetes.io/component: simulator
    app.kubernetes.io/part-of: robotics-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simulator
        app.kubernetes.io/component: simulator
        app.kubernetes.io/part-of: robotics-playground
    spec:
      initContainers:
        - name: clone-env
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          args:
            - --repo=$(ENV_GIT_REPO)
            - --ref=$(ENV_GIT_REF)
            - --root=/git
            - --link=repo
            - --depth=1
            - --one-time
          env:
            - name: ENV_GIT_REPO
              value: https://github.com/redhat-et/ros2_manager_based_env.git
            - name: ENV_GIT_REF
              value: main
          volumeMounts:
            - name: env-source
              mountPath: /git
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

      containers:
        - name: isaac-lab
          image: nvcr.io/nvidia/isaac-lab:2.3.2
          imagePullPolicy: Always
          workingDir: /workspace/isaaclab

          command:
            - /bin/bash
            - -c

          args:
            - |
              set -euo pipefail

              echo "=== Simulator runtime ==="
              echo "PWD=$(pwd)"
              echo "HOME=${HOME}"

              echo
              echo "=== Environment source ==="
              ls -la /git/repo

              echo
              echo "=== Isaac Lab version ==="
              cat /workspace/isaaclab/VERSION

              echo
              echo "=== Isaac Sim Python ==="
              test -x /workspace/isaaclab/_isaac_sim/python.sh
              /workspace/isaaclab/_isaac_sim/python.sh --version

              # Do not source /opt/ros/jazzy/setup.bash here.
              # System ROS2 Jazzy uses Python 3.12; Isaac Sim uses bundled Python 3.11.
              export PYTHONPATH="$(printf '%s' "${PYTHONPATH:-}" | tr ':' '\n' \
                | grep -v '^/opt/ros/jazzy' \
                | paste -sd ':' - || true)"

              export LD_LIBRARY_PATH="$(printf '%s' "${LD_LIBRARY_PATH:-}" | tr ':' '\n' \
                | grep -v '^/opt/ros/jazzy' \
                | paste -sd ':' - || true)"

              unset AMENT_PREFIX_PATH
              unset CMAKE_PREFIX_PATH
              unset COLCON_PREFIX_PATH
              unset ROS_VERSION
              unset ROS_PYTHON_VERSION

              export ISAAC_SIM_PATH=/isaac-sim
              export ROS_DISTRO=jazzy
              export ROS_DOMAIN_ID="${ROS_DOMAIN_ID:-0}"
              export RMW_IMPLEMENTATION="${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"

              export PYTHONPATH="/git/repo:${ISAAC_SIM_PATH}/exts/isaacsim.ros2.bridge/jazzy/rclpy${PYTHONPATH:+:${PYTHONPATH}}"
              export LD_LIBRARY_PATH="${ISAAC_SIM_PATH}/exts/isaacsim.ros2.bridge/jazzy/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"

              echo
              echo "=== ROS 2 configuration ==="
              echo "ROS_DISTRO=${ROS_DISTRO}"
              echo "ROS_DOMAIN_ID=${ROS_DOMAIN_ID}"
              echo "RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}"
              echo "PYTHONPATH=${PYTHONPATH}"
              echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}"

              echo
              echo "=== Checking rclpy ==="
              /workspace/isaaclab/_isaac_sim/python.sh -c \
                "import rclpy; print('rclpy import OK:', rclpy.__file__)"

              echo
              echo "=== Starting simulator ==="
              exec ./isaaclab.sh -p \
                -m "${SIMULATOR_MODULE}" \
                --headless \
                --enable_cameras

          env:
            - name: HOME
              value: /tmp
            - name: ROS_LOCALHOST_ONLY
              value: "1"
            - name: ROS_DOMAIN_ID
              value: "0"
            - name: RMW_IMPLEMENTATION
              value: rmw_fastrtps_cpp
            - name: SIMULATOR_MODULE
              value: ros2_manager_based_env.custom_env_3_3.run_playground

          volumeMounts:
            - name: env-source
              mountPath: /git
              readOnly: true
            - name: kit-cache
              mountPath: /isaac-sim/kit/cache

          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              nvidia.com/gpu: "1"
              memory: 32Gi

        - name: zenoh-bridge
          image: eclipse/zenoh-bridge-ros2dds:1.9.0
          args:
            - -c
            - /etc/zenoh/config.json5
          env:
            - name: ROS_DOMAIN_ID
              value: "0"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: zenoh
              containerPort: 7447
              protocol: TCP
          volumeMounts:
            - name: zenoh-config
              mountPath: /etc/zenoh
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

      volumes:
        - name: env-source
          emptyDir: {}
        - name: zenoh-config
          configMap:
            name: simulator-zenoh-config
        - name: kit-cache
          emptyDir: {}
