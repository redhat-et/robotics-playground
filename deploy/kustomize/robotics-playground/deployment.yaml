apiVersion: apps/v1
kind: Deployment
metadata:
  name: robotics-playground
  labels:
    app.kubernetes.io/name: robotics-playground
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: robotics-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: robotics-playground
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robotics-playground
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: robotics-playground
    spec:
      initContainers:
        - name: zenoh-bridge
          image: eclipse/zenoh-bridge-ros2dds:1.9.0
          restartPolicy: Always
          command: ["/bin/ash", "-c"]
          args:
            - |
              while true; do
                /zenoh-bridge-ros2dds -c /etc/zenoh/config.json5
                echo "zenoh-bridge exited, retrying in 5s..."
                sleep 5
              done
          env:
            - name: ROS_LOCALHOST_ONLY
              value: "1"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: zenoh-config
              mountPath: /etc/zenoh
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: api
          image: quay.io/redhat-et/robotics-playground:latest
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: rerun-grpc
              containerPort: 9876
              protocol: TCP
          env:
            - name: PLAYGROUND_CONFIG
              value: /etc/robotics-playground/config.yaml
            - name: ROS_LOCALHOST_ONLY
              value: "1"
            - name: RMW_IMPLEMENTATION
              value: rmw_cyclonedds_cpp
          volumeMounts:
            - name: config
              mountPath: /etc/robotics-playground
              readOnly: true
            - name: rerun-data
              mountPath: /data/rerun
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 1536Mi
            limits:
              memory: 3Gi
      volumes:
        - name: config
          configMap:
            name: robotics-playground-config
        - name: zenoh-config
          configMap:
            name: zenoh-backend-config
        - name: rerun-data
          emptyDir:
            sizeLimit: 2Gi
